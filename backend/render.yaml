services:
  - type: web
    name: prime-car-center-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: prime-car-center-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://getandfix.com,https://app.getandfix.com"

databases:
  - name: prime-car-center-db
    databaseName: pcc_db
    user: pcc_user
